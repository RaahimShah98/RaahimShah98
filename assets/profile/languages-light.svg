<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Language mix across repositories">
<title>Language mix across repositories</title>
<style>
text{font-family:'Segoe UI', -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif;fill:#17212d}
.m{fill:#5a6676}.fa{fill:#98a3b1}.mono{font-family:ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace}

