</style>
<rect x="0.5" y="0.5" width="1199" height="319" rx="12" fill="#ffffff" stroke="#dde3ea"/>
<text x="56" y="52" font-size="21" font-weight="600" letter-spacing="-0.2">Language mix</text>
<text x="56" y="78" font-size="14" class="m">Each repository counts once, split by its bytes of code, so one large notebook cannot skew the picture</text>
<rect x="56" y="112" width="426.5" height="18" rx="3" fill="#c1841f"><title>TypeScript: 38.7%</title></rect><rect x="485.5" y="112" width="162" height="18" rx="3" fill="#24877f"><title>JavaScript: 14.8%</title></rect><rect x="650.5" y="112" width="139.3" height="18" rx="3" fill="#4f66b0"><title>Python: 12.8%</title></rect><rect x="792.8" y="112" width="135.9" height="18" rx="3" fill="#b85a6a"><title>Jupyter Notebook: 12.5%</title></rect><rect x="931.7" y="112" width="70.4" height="18" rx="3" fill="#6f9440"><title>PLpgSQL: 6.6%</title></rect><rect x="1005.2" y="112" width="48.9" height="18" rx="3" fill="#8a5aa6"><title>CSS: 4.7%</title></rect><rect x="1057.1" y="112" width="43.3" height="18" rx="3" fill="#6b7788"><title>Java: 4.2%</title></rect><rect x="1103.4" y="112" width="37.6" height="18" rx="3" fill="#6b7788"><title>HTML: 3.7%</title></rect><rect x="56" y="165" width="12" height="12" rx="2" fill="#c1841f"/>
