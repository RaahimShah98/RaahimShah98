<rect x="0.5" y="0.5" width="1199" height="319" rx="12" fill="#0f1722" stroke="#233044"/>
<text x="56" y="52" font-size="21" font-weight="600" letter-spacing="-0.2">Language mix</text>
<text x="56" y="78" font-size="14" class="m">Each repository counts once, split by its bytes of code, so one large notebook cannot skew the picture</text>
<rect x="56" y="112" width="409" height="18" rx="3" fill="#f2b33d"><title>TypeScript: 37.1%</title></rect><rect x="468" y="112" width="155.3" height="18" rx="3" fill="#4fb8b0"><title>JavaScript: 14.3%</title></rect><rect x="626.3" y="112" width="133.5" height="18" rx="3" fill="#7f97d6"><title>Python: 12.3%</title></rect><rect x="762.8" y="112" width="130.2" height="18" rx="3" fill="#d98b98"><title>Jupyter Notebook: 12.0%</title></rect><rect x="896" y="112" width="111.8" height="18" rx="3" fill="#a5c47c"><title>PLpgSQL: 10.3%</title></rect><rect x="1010.8" y="112" width="46.8" height="18" rx="3" fill="#c79bdb"><title>CSS: 4.5%</title></rect><rect x="1060.6" y="112" width="41.4" height="18" rx="3" fill="#7d8a9c"><title>Java: 4.0%</title></rect><rect x="1105" y="112" width="36" height="18" rx="3" fill="#7d8a9c"><title>HTML: 3.5%</title></rect><rect x="56" y="165" width="12" height="12" rx="2" fill="#f2b33d"/>
