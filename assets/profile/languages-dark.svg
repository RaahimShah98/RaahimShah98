</style>
<rect x="0.5" y="0.5" width="1199" height="319" rx="12" fill="#0f1722" stroke="#233044"/>
<text x="56" y="52" font-size="21" font-weight="600" letter-spacing="-0.2">Language mix</text>
<text x="56" y="78" font-size="14" class="m">Each repository counts once, split by its bytes of code, so one large notebook cannot skew the picture</text>
<rect x="56" y="112" width="422.8" height="18" rx="3" fill="#f2b33d"><title>TypeScript: 38.4%</title></rect><rect x="481.8" y="112" width="164.1" height="18" rx="3" fill="#4fb8b0"><title>Python: 15.1%</title></rect><rect x="649" y="112" width="143.9" height="18" rx="3" fill="#7f97d6"><title>JavaScript: 13.2%</title></rect><rect x="795.9" y="112" width="120.2" height="18" rx="3" fill="#d98b98"><title>Jupyter Notebook: 11.1%</title></rect><rect x="919.1" y="112" width="98.8" height="18" rx="3" fill="#a5c47c"><title>PLpgSQL: 9.2%</title></rect><rect x="1020.9" y="112" width="43" height="18" rx="3" fill="#c79bdb"><title>CSS: 4.2%</title></rect><rect x="1066.9" y="112" width="38.1" height="18" rx="3" fill="#7d8a9c"><title>Java: 3.7%</title></rect><rect x="1108" y="112" width="33" height="18" rx="3" fill="#7d8a9c"><title>HTML: 3.3%</title></rect><rect x="56" y="165" width="12" height="12" rx="2" fill="#f2b33d"/>
