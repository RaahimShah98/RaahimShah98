<text x="326" y="248" font-size="15" text-anchor="end" class="mono">9.5%</text>
<text x="346" y="248" font-size="13.5" class="m">4 repos</text><rect x="616" y="237" width="12" height="12" rx="2" fill="#c79bdb"/>
