<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="284" viewBox="0 0 1200 284" role="img" aria-label="Language mix across repositories">
<title>Language mix across repositories</title>
<style>
text{font-family:'Segoe UI', -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif;fill:#e7ebf0}
.m{fill:#8b98a9}.fa{fill:#56647a}.mono{font-family:ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect x="0.5" y="0.5" width="1199" height="283" rx="12" fill="#0f1722" stroke="#233044"/>
<text x="56" y="52" font-size="21" font-weight="600" letter-spacing="-0.2">Language mix</text>
<text x="56" y="78" font-size="14" class="m">Each repository counts once, split by its bytes of code, so one large notebook cannot skew the picture</text>
<rect x="56" y="112" width="463.6" height="18" rx="3" fill="#f2b33d"><title>Jupyter Notebook: 42.9%</title></rect><rect x="522.6" y="112" width="358.4" height="18" rx="3" fill="#4fb8b0"><title>TypeScript: 33.2%</title></rect><rect x="884" y="112" width="179.1" height="18" rx="3" fill="#7f97d6"><title>JavaScript: 16.7%</title></rect><rect x="1066" y="112" width="55.4" height="18" rx="3" fill="#d98b98"><title>CSS: 5.4%</title></rect><rect x="1124.5" y="112" width="16.5" height="18" rx="3" fill="#a5c47c"><title>HTML: 1.8%</title></rect><rect x="56" y="165" width="12" height="12" rx="2" fill="#f2b33d"/>
<text x="78" y="176" font-size="15">Jupyter Notebook</text>
<text x="326" y="176" font-size="15" text-anchor="end" class="mono">42.9%</text>
<text x="346" y="176" font-size="13.5" class="m">3 repos</text><rect x="616" y="165" width="12" height="12" rx="2" fill="#4fb8b0"/>
<text x="638" y="176" font-size="15">TypeScript</text>
<text x="886" y="176" font-size="15" text-anchor="end" class="mono">33.2%</text>
<text x="906" y="176" font-size="13.5" class="m">3 repos</text><rect x="56" y="201" width="12" height="12" rx="2" fill="#7f97d6"/>
<text x="78" y="212" font-size="15">JavaScript</text>
<text x="326" y="212" font-size="15" text-anchor="end" class="mono">16.7%</text>
<text x="346" y="212" font-size="13.5" class="m">2 repos</text><rect x="616" y="201" width="12" height="12" rx="2" fill="#d98b98"/>
<text x="638" y="212" font-size="15">CSS</text>
<text x="886" y="212" font-size="15" text-anchor="end" class="mono">5.4%</text>
<text x="906" y="212" font-size="13.5" class="m">1 repo</text><rect x="56" y="237" width="12" height="12" rx="2" fill="#a5c47c"/>
<text x="78" y="248" font-size="15">HTML</text>
<text x="326" y="248" font-size="15" text-anchor="end" class="mono">1.8%</text>
<text x="346" y="248" font-size="13.5" class="m">1 repo</text>
</svg>