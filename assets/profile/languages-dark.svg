<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Language mix across repositories">
<title>Language mix across repositories</title>
<style>
text{font-family:'Segoe UI', -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif;fill:#e7ebf0}
.m{fill:#8b98a9}.fa{fill:#56647a}.mono{font-family:ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace}

