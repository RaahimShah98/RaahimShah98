<text x="326" y="176" font-size="15" text-anchor="end" class="mono">38.4%</text>
<text x="346" y="176" font-size="13.5" class="m">12 repos</text><rect x="616" y="165" width="12" height="12" rx="2" fill="#4fb8b0"/>
