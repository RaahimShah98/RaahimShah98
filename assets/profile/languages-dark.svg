</style>
<rect x="0.5" y="0.5" width="1199" height="319" rx="12" fill="#0f1722" stroke="#233044"/>
<text x="56" y="52" font-size="21" font-weight="600" letter-spacing="-0.2">Language mix</text>
<text x="56" y="78" font-size="14" class="m">Each repository counts once, split by its bytes of code, so one large notebook cannot skew the picture</text>
<rect x="56" y="112" width="439.4" height="18" rx="3" fill="#f2b33d"><title>TypeScript: 39.9%</title></rect><rect x="498.4" y="112" width="166.2" height="18" rx="3" fill="#4fb8b0"><title>JavaScript: 15.3%</title></rect><rect x="667.6" y="112" width="136.9" height="18" rx="3" fill="#7f97d6"><title>Python: 12.6%</title></rect><rect x="807.5" y="112" width="115.7" height="18" rx="3" fill="#d98b98"><title>Jupyter Notebook: 10.7%</title></rect><rect x="926.2" y="112" width="95.3" height="18" rx="3" fill="#a5c47c"><title>PLpgSQL: 8.9%</title></rect><rect x="1024.5" y="112" width="41.8" height="18" rx="3" fill="#c79bdb"><title>CSS: 4.0%</title></rect><rect x="1069.3" y="112" width="36.6" height="18" rx="3" fill="#7d8a9c"><title>Java: 3.6%</title></rect><rect x="1108.9" y="112" width="32.1" height="18" rx="3" fill="#7d8a9c"><title>HTML: 3.2%</title></rect><rect x="56" y="165" width="12" height="12" rx="2" fill="#f2b33d"/>
