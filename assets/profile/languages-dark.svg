<text x="326" y="176" font-size="15" text-anchor="end" class="mono">36.2%</text>
<text x="346" y="176" font-size="13.5" class="m">11 repos</text><rect x="616" y="165" width="12" height="12" rx="2" fill="#4fb8b0"/>
<text x="638" y="176" font-size="15">Python</text>
<text x="886" y="176" font-size="15" text-anchor="end" class="mono">15.7%</text>
<text x="906" y="176" font-size="13.5" class="m">5 repos</text><rect x="56" y="201" width="12" height="12" rx="2" fill="#7f97d6"/>
<text x="78" y="212" font-size="15">JavaScript</text>
<text x="326" y="212" font-size="15" text-anchor="end" class="mono">13.7%</text>
<text x="346" y="212" font-size="13.5" class="m">7 repos</text><rect x="616" y="201" width="12" height="12" rx="2" fill="#d98b98"/>
<text x="638" y="212" font-size="15">Jupyter Notebook</text>
<text x="886" y="212" font-size="15" text-anchor="end" class="mono">11.5%</text>
<text x="906" y="212" font-size="13.5" class="m">3 repos</text><rect x="56" y="237" width="12" height="12" rx="2" fill="#a5c47c"/>
