<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Language mix across repositories">
<title>Language mix across repositories</title>
<style>
text{font-family:'Segoe UI', -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif;fill:#e7ebf0}
.m{fill:#8b98a9}.fa{fill:#56647a}.mono{font-family:ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect x="0.5" y="0.5" width="1199" height="319" rx="12" fill="#0f1722" stroke="#233044"/>
<text x="56" y="52" font-size="21" font-weight="600" letter-spacing="-0.2">Language mix</text>
<text x="56" y="78" font-size="14" class="m">Each repository counts once, split by its bytes of code, so one large notebook cannot skew the picture</text>
<rect x="56" y="112" width="398.3" height="18" rx="3" fill="#f2b33d"><title>TypeScript: 36.2%</title></rect><rect x="457.3" y="112" width="170.7" height="18" rx="3" fill="#4fb8b0"><title>Python: 15.7%</title></rect><rect x="630.9" y="112" width="149.1" height="18" rx="3" fill="#7f97d6"><title>JavaScript: 13.7%</title></rect><rect x="783" y="112" width="125" height="18" rx="3" fill="#d98b98"><title>Jupyter Notebook: 11.5%</title></rect><rect x="911" y="112" width="102" height="18" rx="3" fill="#a5c47c"><title>PLpgSQL: 9.5%</title></rect><rect x="1016" y="112" width="44.8" height="18" rx="3" fill="#c79bdb"><title>CSS: 4.3%</title></rect><rect x="1063.9" y="112" width="39.7" height="18" rx="3" fill="#7d8a9c"><title>Java: 3.8%</title></rect><rect x="1106.5" y="112" width="34.5" height="18" rx="3" fill="#7d8a9c"><title>HTML: 3.4%</title></rect><rect x="56" y="165" width="12" height="12" rx="2" fill="#f2b33d"/>
