name: Refresh profile

on:
  schedule:
    - cron: '17 3 * * *' # daily, 03:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/profile/**', '.github/workflows/profile.yml']

permissions:
  contents: write

concurrency:
  group: refresh-profile
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rebuild README and charts from GitHub data
        env:
          # GH_TOKEN (a personal token) also counts private contributions; the built-in token covers public data.
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: node .github/profile/generate.mjs

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/profile
          if git diff --cached --quiet; then
            echo "Profile unchanged."
            exit 0
          fi
          git commit -m "Refresh profile data"
          git pull --rebase
          git push
